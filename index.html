<!doctype html>
<!-- deploy test: pipeline wired up -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Atelier - A Digital Closet</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<script>try{var t=JSON.parse(localStorage.getItem('atelier:theme')||'"system"');var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app">
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="favicon.png" alt="" aria-hidden="true" width="32" height="32"><span class="brand-name">Atelier</span></div>
    <nav class="nav" aria-label="Main">
      <button class="nav-btn" data-view="closet" aria-current="page" data-i18n="nav.closet">Closet</button>
      <button class="nav-btn" data-view="outfits" data-i18n="nav.outfits">Outfit Builder</button>
    </nav>
    <div class="top-actions">
      <div class="topnav" id="topNav">
        <button class="icon-btn topnav-btn" id="notifBtn" type="button" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false" title="Notifications"><span class="topnav-dot" id="notifDot" hidden></span></button>
        <button class="icon-btn topnav-btn" id="syncBtn" type="button" aria-label="Sync with Google Drive" title="Sync with Google Drive" aria-busy="false"></button>
        <button class="topnav-account" id="accountBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Account menu" title="Account">
          <span class="topnav-avatar" id="accountAvatar" aria-hidden="true"></span>
          <span class="topnav-chevron" id="accountChevron" aria-hidden="true"></span>
        </button>
        <div class="topmenu" id="accountMenu" role="dialog" aria-label="Account" hidden></div>
        <div class="topmenu notif-panel" id="notifMenu" role="dialog" aria-label="Notifications" hidden></div>
      </div>
    </div>
  </header>
  <main id="main">
    <section id="view-closet" class="view"></section>
    <section id="view-outfits" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>
  <nav class="bottom-nav" aria-label="Main mobile">
    <button class="nav-btn" data-view="closet" aria-current="page" data-i18n="nav.closet">Closet</button>
    <button class="nav-btn" data-view="outfits" data-i18n="nav.outfits">Outfit Builder</button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
